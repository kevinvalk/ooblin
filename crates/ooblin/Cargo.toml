[package]
name = "ooblin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Only for the verify build (`cargo verify`), where agents drive the app through a WebSocket on localhost
# (mcp-server-tauri).
[features]
verify = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4"
log = "0.4"
ooblin-core = { path = "../ooblin-core" }
# Native file dialogs, with GTK on Linux as that is what Tauri itself uses there.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["time"] }
ts-rs = "12"

[dev-dependencies]
mock = { path = "../mock" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
