[package]
name = "ooblin"
version = "0.0.0" # A build from source says so. CI sets the version from the tag (see .github/workflows/ci.yml).
edition = "2024"
license = "Apache-2.0"
publish = false

# Only for the verify build (`cargo verify`), where agents drive the app through a WebSocket on localhost
# (mcp-server-tauri).
[features]
verify = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = "4"
log = "0.4"
ooblin-core = { path = "../ooblin-core" }
# We never call it ourselves: this is the TLS of the updater's reqwest, rustls on aws-lc-rs as ooblin-core's (one crate
# for both), so the updater gets HTTPS from us and not from whatever ooblin-core happens to use.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Native file dialogs, with GTK on Linux as that is what Tauri itself uses there.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2"
tauri-plugin-mcp-bridge = { version = "0.13", optional = true }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Without its own TLS, which is rustls on ring: with ring next to our aws-lc-rs, rustls picks neither by itself and every
# TLS connection we make fails. It takes ours, see `reqwest`. `zip` unpacks an update.
tauri-plugin-updater = { version = "2", default-features = false, features = ["system-proxy", "zip"] }
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["time"] }
ts-rs = "12"

[dev-dependencies]
mock = { path = "../mock" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
