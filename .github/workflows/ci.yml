# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main] # We only push on main, as a branch of a pull request is already checked as the pull request
    tags: ["v*"]
  pull_request:

# A newer push makes the run in flight pointless so we cancel it, but a tag ALWAYS finishes as that is a real release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# SECURITY: Everything we lint, test and build runs code of others (build scripts of crates, npm packages), so those
# jobs can only read and never see a secret. Only the last job can write and sign, and of others it runs Tauri's CLI
# alone.
permissions: {}

env:
  VERSION_TAURI_CLI: 2.12.4

# NOTE: The steps the jobs share are written once, as YAML anchors (`&name`) in the first job that has them.
jobs:
  lint-and-test:
    strategy: &every-system
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions: &read
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
      - &linux-libraries
        name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - &node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - &rust
        name: Install the Rust of rust-toolchain.toml
        run: rustup toolchain install
      # NOTE: The key of the cache names the system but NOT its version, and what one Ubuntu built does not build on
      # another (we had "can't find crate for `tauri`" going from 24.04 to 22.04).
      - &rust-cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.os }}
      - &ui-packages
        run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace # With 8 rounds of garbled devices, see `garble-and-read`
      # The tests write the TypeScript bindings of the UI, so a difference means somebody forgot to commit them.
      - run: git diff --exit-code ui/src/bindings

  # The same garbled devices as `lint-and-test`, many more of them (crates/ooblin-core/tests/garbled.rs). A failure
  # fails the run, but nothing waits for it: the 8 rounds above gate building and releasing, these look further.
  garble-and-read:
    strategy: *every-system
    runs-on: ${{ matrix.os }}
    permissions: *read
    steps:
      - *checkout
      - *rust
      - *rust-cache
      - run: cargo test -p ooblin-core --test garbled
        env:
          GARBLED: 200

  # On main this becomes the rolling "Unstable" prerelease and on a `v*` tag the release of that tag.
  build-and-bundle:
    needs: lint-and-test
    if: github.event_name == 'push' # So not for a pull request
    strategy:
      fail-fast: false
      matrix:
        include:
          # We build one universal app instead of one per architecture, that way there is a single download that runs
          # on every Mac. We have no certificate yet so we sign ad-hoc (`-`), as Apple silicon runs NO code without a
          # signature. Users have to allow the app once in Privacy & Security.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - os: windows-latest
          # NOTE: The app only runs on a glibc at least as new as the one it was built with. So we build on the oldest
          # Ubuntu that still has a runner, that way it also runs on Ubuntu 22.04 and Debian 12.
          - os: ubuntu-22.04
          # Linux on arm64 cannot run an x64 app so it needs its own build. Windows on arm64 can, so we skip
          # windows-11-arm until someone asks for it.
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions: *read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # The version of Unstable counts the commits since the last tag
      # IMPORTANT: The tag is the version, Cargo.toml says 0.0.0. Unstable is the last release plus the commits since,
      # as `0.2.0+5`: the updater offers it the next release but not the one it was built on. A tag is `vX.Y.Z` alone,
      # as MSI takes only a number after it (0.2.0.5) and RPM no hyphen at all.
      - name: Set the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::A release is tagged vX.Y.Z, not $GITHUB_REF_NAME"; exit 1; }
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || last=""
            version="${last:-v0.0.0}+$(git rev-list --count ${last:+$last..}HEAD)"
            version=${version#v}
          fi
          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$version\"/" crates/ooblin/Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - *linux-libraries
      - *node
      - *rust
      - name: Add the Mac architectures
        if: matrix.targets
        run: rustup target add ${{ matrix.targets }}
      - *rust-cache
      - *ui-packages
      # TODO: We have no certificates yet so everything is unsigned. Signing goes here: the APPLE_* secrets of Apple in
      # env and those of Windows in a --config. The updater signs in the release job.
      - run: npx --yes "@tauri-apps/cli@$VERSION_TAURI_CLI" build ${{ matrix.args }}
      # The updater replaces the app with the one in a tarball. We pack it ourselves, as Tauri only does when it has the
      # updater's key, which this job never gets.
      - name: Pack the app for the updater
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        working-directory: target/universal-apple-darwin/release/bundle/macos
        run: COPYFILE_DISABLE=1 tar -czf "Ooblin_${VERSION}_universal.app.tar.gz" Ooblin.app
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    needs: build-and-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    # NOTE: Only a `shell` set by name runs with pipefail, without it a failing signature vanishes in the pipe to jq.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: bundles
          merge-multiple: true
      # An artifact keeps the folders of its build (`release/bundle/msi/`), we want the bundles side by side.
      - run: find bundles -mindepth 2 -type f -exec mv --target-directory=bundles {} +
      - name: Install Tauri's CLI, which signs for the updater
        if: github.ref_type == 'tag'
        run: npm install --global --ignore-scripts "@tauri-apps/cli@$VERSION_TAURI_CLI"
      # SECURITY: Only this step sees the updater's key, so none of the code we build ever does. An app takes an update
      # only with this key's signature, and we sign each bundle that can update itself. `latest.json` is what the app
      # asks for (see `plugins.updater` in tauri.conf.json), by `{os}-{arch}-{bundle}` as the updater plugin looks
      # them up. The Mac's one app is both of its architectures.
      - name: Sign the bundles for the updater
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: bundles
        run: |
          version=${GITHUB_REF_NAME#v}
          declare -A bundles=(
            [darwin-aarch64-app]=Ooblin_${version}_universal.app.tar.gz
            [darwin-x86_64-app]=Ooblin_${version}_universal.app.tar.gz
            [windows-x86_64-nsis]=Ooblin_${version}_x64-setup.exe
            [windows-x86_64-msi]=Ooblin_${version}_x64_en-US.msi
            [linux-x86_64-appimage]=Ooblin_${version}_amd64.AppImage
            [linux-aarch64-appimage]=Ooblin_${version}_aarch64.AppImage
            [linux-x86_64-deb]=Ooblin_${version}_amd64.deb
            [linux-aarch64-deb]=Ooblin_${version}_arm64.deb
            [linux-x86_64-rpm]=Ooblin-${version}-1.x86_64.rpm
            [linux-aarch64-rpm]=Ooblin-${version}-1.aarch64.rpm
          )
          for platform in "${!bundles[@]}"; do
            bundle=${bundles[$platform]}
            [ -e "$bundle.sig" ] || tauri signer sign --app-version "$version" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$bundle"
            jq --null-input --arg platform "$platform" --rawfile signature "$bundle.sig" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$bundle" \
              '{ ($platform): { url: $url, signature: ($signature | rtrimstr("\n")) } }'
          done | jq --slurp --arg version "$version" '{ version: $version, pub_date: (now | todate), platforms: add }' > latest.json
      # Deleting the release also deletes its assets and its tag (and the draft of a cancelled run). Creating it below
      # makes the tag again at this commit. We let the API do that as our token cannot push a tag without the
      # `workflows` permission.
      - name: Delete the previous Unstable
        if: github.ref_type != 'tag'
        run: if gh release view unstable > /dev/null 2>&1; then gh release delete unstable --cleanup-tag --yes; fi
      # NOTE: With files `gh` creates a draft, uploads them and only then publishes. So nobody downloads half a
      # release, and a failed run leaves the previous release as it was.
      - name: Release the bundles
        run: |
          mapfile -t files < <(find bundles -type f)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${files[@]}"
          else
            gh release create unstable --target "$GITHUB_SHA" --prerelease --title Unstable \
              --notes "The latest build of main, $GITHUB_SHA. Untested." "${files[@]}"
          fi
      - uses: actions/checkout@v7.0.1
        if: github.ref_type == 'tag'
        with:
          ref: main
          path: repository
      # The cask on main is how `brew install` finds the release (see Casks/ooblin.rb), so we commit it there. A push of
      # our own token starts no workflow, so this does not build main again.
      - name: Point the Homebrew cask at the release
        if: github.ref_type == 'tag'
        working-directory: repository
        run: |
          version=${GITHUB_REF_NAME#v}
          sha256=$(sha256sum "../bundles/Ooblin_${version}_universal.dmg" | cut -d ' ' -f 1)
          perl -pi -e "s/^  version \"[^\"]*\"/  version \"$version\"/; s/^  sha256 \"[^\"]*\"/  sha256 \"$sha256\"/" Casks/ooblin.rb
          git diff --quiet && exit 0 # A release made again finds the cask pointing at it already

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "chore: Homebrew cask for $GITHUB_REF_NAME" Casks/ooblin.rb
          git push origin HEAD:main
