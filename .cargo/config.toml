[alias]
# The debug app for our verify loop (AGENTS.md): its own identifier, so it has its own devices and keychain entries,
# hidden so it never steals focus, and without CSP because the MCP bridge injects inline scripts.
verify = [
  "tauri", "build", "--debug", "--no-bundle",
  "--config", '{"identifier":"nl.kevinvalk.ooblin.verify","app":{"windows":[{"width":1180,"height":860,"visible":false}],"security":{"csp":null}}}',
]

# The app as we ship it: bundled, and without Tauri's API on `window.__TAURI__`, which only debug builds' MCP bridge uses
# (the UI imports it), so no script in the window has it at hand. Tauri decides that at compile time.
release = ["tauri", "build", "--config", '{"app":{"withGlobalTauri":false}}']

# `cargo test` writes the types the UI sees to ui/src/bindings (ts-rs), a file per crate, numbers not bigints.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/bindings", relative = true }
TS_RS_LARGE_INT = "number"
