<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMT Console</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header data-tauri-drag-region></header>

    <form id="connect" autocomplete="off" spellcheck="false">
      <h1>AMT Console</h1>
      <label>Host <input name="host" placeholder="192.168.1.50" required autofocus /></label>
      <label>User <input name="user" value="admin" required /></label>
      <label>Password <input name="password" type="password" required /></label>
      <button type="submit">Connect</button>
      <output></output>
    </form>

    <section id="device" hidden>
      <h1 data-field="name"></h1>
      <p class="tags"><span data-field="version"></span> <span data-field="mode"></span></p>
      <dl>
        <dt>Digest realm</dt>
        <dd data-field="realm"></dd>
        <dt>Certificate</dt>
        <dd><code data-field="fingerprint"></code></dd>
        <dd data-field="trust"></dd>
      </dl>
      <button type="button" class="secondary" data-action="disconnect">Disconnect</button>
    </section>

    <template id="pin-mismatch">
      <p>
        This device presented a different certificate than the one we pinned. That's expected after reprovisioning or
        reflashing the ME, anything else may be someone in the middle.
      </p>
      <dl>
        <dt>Pinned</dt>
        <dd><code data-field="expected"></code></dd>
        <dt>Presented</dt>
        <dd><code data-field="actual"></code></dd>
      </dl>
      <button type="button" class="danger" data-action="trust">Trust the new certificate</button>
    </template>
  </body>
</html>
