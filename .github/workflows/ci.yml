# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main] # We only push on main, as a branch of a pull request is already checked as the pull request
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # Every night we try many more garbled devices than a push wants to wait for

# A newer push makes the run in flight pointless so we cancel it, but a tag ALWAYS finishes as that is a real release.
# The event is part of the group as we do not want a push to cancel the run of the night.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# SECURITY: Everything we lint, test and build runs code of others (build scripts of crates, npm packages), so those
# jobs can only read. Only the last job can write, and it runs none of that code.
permissions: {}

env:
  VERSION_TAURI_CLI: 2.12.4

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the Rust of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
        env:
          GARBLED: ${{ github.event_name == 'schedule' && 200 || 8 }} # 200 rounds at night, 8 on a push
      # The tests write the TypeScript bindings of the UI, so a difference means somebody forgot to commit them.
      - run: git diff --exit-code ui/src/bindings

  # On main this becomes the rolling "Unstable" prerelease and on a `v*` tag the release of that tag.
  build-and-bundle:
    needs: lint-and-test
    if: github.event_name == 'push' # So not for a pull request and not at night
    strategy:
      fail-fast: false
      matrix:
        include:
          # We build one universal app instead of one per architecture, that way there is a single download that runs
          # on every Mac. We have no certificate yet so we sign ad-hoc (`-`), as Apple silicon runs NO code without a
          # signature. Users have to allow the app once in Privacy & Security.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - os: windows-latest
          # NOTE: The app only runs on a glibc at least as new as the one it was built with. So we build on the oldest
          # Ubuntu that still has a runner, that way it also runs on Ubuntu 22.04 and Debian 12.
          - os: ubuntu-22.04
          # Linux on arm64 cannot run an x64 app so it needs its own build. Windows on arm64 can, so we skip
          # windows-11-arm until someone asks for it.
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Tauri names the bundles after the version of the crate, so we do not want v0.2.0 to ship an ooblin_0.1.0!
      - name: Fail if the tag is not the version of the app
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/ooblin/Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Cargo.toml says $version"; exit 1; }
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the Rust of rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the Mac architectures
        if: matrix.targets
        run: rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        # NOTE: The key of the cache names the system but NOT its version, and what one Ubuntu built does not build
        # on another (we had "can't find crate for `tauri`" going from 24.04 to 22.04).
        with:
          key: ${{ matrix.os }}
      - run: npm ci --prefix ui
      # The cache above keeps the installed binary, so we only really build the Tauri CLI once per version.
      - run: cargo install tauri-cli --version "$VERSION_TAURI_CLI" --locked
      # TODO: We have no certificates yet so everything is unsigned. Signing goes here: the APPLE_* secrets of Apple in
      # env and those of Windows in a --config.
      - run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    needs: build-and-bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true
      # Deleting the release also deletes its assets and its tag (and the draft of a cancelled run). Creating it below
      # makes the tag again at this commit. We let the API do that as our token cannot push a tag without the
      # `workflows` permission.
      - name: Delete the previous Unstable
        if: github.ref_type != 'tag'
        run: if gh release view unstable > /dev/null 2>&1; then gh release delete unstable --cleanup-tag --yes; fi
      # NOTE: With files `gh` creates a draft, uploads them and only then publishes. So nobody downloads half a
      # release, and a failed run leaves the previous release as it was.
      - name: Release the bundles
        run: |
          mapfile -t files < <(find bundles -type f)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${files[@]}"
          else
            gh release create unstable --target "$GITHUB_SHA" --prerelease --title Unstable \
              --notes "The latest build of main, $GITHUB_SHA. Untested." "${files[@]}"
          fi
