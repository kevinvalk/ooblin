[alias]
# The debug app for our verify loop (AGENTS.md) with the MCP bridge (the `verify` feature): its own identifier, so it
# has its own devices and keychain entries, hidden so it never steals focus, and Tauri's API on `window.__TAURI__` and
# no CSP, which the bridge needs. Every other build leaves both out.
verify = [
  "tauri", "build", "--debug", "--no-bundle", "--features", "verify",
  "--config", '{"identifier":"nl.kevinvalk.ooblin.verify","app":{"withGlobalTauri":true,"windows":[{"width":1180,"height":860,"visible":false}],"security":{"csp":null}}}',
]

# `cargo test` writes the types the UI sees to ui/src/bindings (ts-rs), a file per crate, numbers not bigints.
[env]
TS_RS_EXPORT_DIR = { value = "ui/src/bindings", relative = true }
TS_RS_LARGE_INT = "number"
