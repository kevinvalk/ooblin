[package]
name = "amt-console"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
amt-core = { path = "../amt-core" }
clap = { version = "4", features = ["derive"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-mcp-bridge = "0.13"
