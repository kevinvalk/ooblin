[package]
name = "amt-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
digest_auth = "0.3"
getrandom = "0.3"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time"] }
tokio-rustls = "0.26"

[dev-dependencies]
mock-amt = { path = "../mock-amt" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
