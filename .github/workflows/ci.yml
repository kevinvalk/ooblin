# The checks of AGENTS.md on every pull request and push to main, on each platform we ship for, against the mock
# devices. And whether the TypeScript bindings `cargo test` writes are the ones committed.
name: CI

# A pull request's branch is checked as the pull request, not once more as a push. And every night, against many more
# garbled devices than a push waits for (see crates/ooblin-core/tests/garbled.rs).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the Rust of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
        env:
          GARBLED: ${{ github.event_name == 'schedule' && 200 || 8 }}
      - name: Check the bindings are committed as cargo test wrote them
        run: git diff --exit-code ui/src/bindings
