# The app as `cargo tauri build` builds it, for every platform, into a GitHub release: on main the rolling prerelease
# "Unstable" (tag `unstable`, made anew at the pushed commit with its assets), on a `v*` tag that tag's release.
# The builds may only read: what they run (crates' build scripts, npm packages) never holds a token that writes. The
# last job, which runs none of it, makes the release of what they built, so one that fails leaves the release before.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

# A newer push to main makes the unstable build in flight moot, a tag's build always finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal app rather than one per architecture: a single download that runs on every Mac, for one
          # runner building both. Unsigned, so ad-hoc signed (`-`): Apple silicon runs no code without a signature,
          # and users allow the app once in Privacy & Security.
          - os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          - os: windows-latest
          # The oldest Ubuntu there is a runner of: the app runs on a glibc as new as the one it was built on, so on
          # Ubuntu 22.04 and Debian 12 too.
          - os: ubuntu-22.04
          # Linux on arm64 has no x64 emulation to fall back on, so it gets its own build. Windows on arm64 does, and
          # runs the x64 app, so we leave windows-11-arm until someone asks.
          - os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Tauri names the bundles after the crate's version, so v0.2.0 must not ship ooblin_0.1.0.
      - name: Check the tag is the app's version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/ooblin/Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Cargo.toml says $version"; exit 1; }
      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the Rust of rust-toolchain.toml
        run: rustup toolchain install
      - name: Add the Mac architectures
        if: matrix.targets
        run: rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        # Its key names the system but not its version, and what one Ubuntu built doesn't build on another.
        with:
          key: ${{ matrix.os }}
      - run: npm ci --prefix ui
      # One version of the Tauri CLI, as its own lock file built it, which the cache above keeps.
      - run: cargo install tauri-cli --version 2.12.4 --locked
      # No certificates yet, so unsigned. Signing goes here: Apple's APPLE_* secrets in env, Windows' in a --config.
      - run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          merge-multiple: true
      # Deleting the release takes its assets and tag along, a cancelled run's draft too. Creating it makes the tag
      # anew, at this commit: the API does, as a token without the `workflows` permission can't push one.
      - name: Delete the Unstable before
        if: github.ref_type != 'tag'
        run: if gh release view unstable > /dev/null 2>&1; then gh release delete unstable --cleanup-tag --yes; fi
      # With files `gh` creates a draft, uploads them and only then publishes: nobody downloads a release half there.
      - name: Release what was built
        run: |
          mapfile -t files < <(find bundles -type f)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${files[@]}"
          else
            gh release create unstable --target "$GITHUB_SHA" --prerelease --title Unstable \
              --notes "The latest build of main, $GITHUB_SHA. Untested." "${files[@]}"
          fi
