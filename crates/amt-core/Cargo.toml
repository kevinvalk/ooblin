[package]
name = "amt-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.23"
digest_auth = "0.3"
flate2 = "1"
instant-xml = "0.7"
jiff = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
ts-rs = "12"

[dev-dependencies]
anyhow = "1"
mock-amt = { path = "../mock-amt" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
